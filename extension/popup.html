<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>coreText</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: inline-block;
      background: #fff;
      font: 13px Arial, sans-serif;
      overflow: hidden;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 4px 6px 12px;
      gap: 2px;
      white-space: nowrap;
    }

    #search {
      border: none;
      outline: none;
      font: inherit;
      color: inherit;
      background: transparent;
      width: 160px;
    }

    #count {
      color: #5f6368;
      padding: 0 8px;
      min-width: 1ch;
      width: fit-content;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: #e0e0e0;
      margin: 0 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border: none;
      background: transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #5f6368;
      font-size: 13px;
      line-height: 1;
      padding: 0;
    }

    .icon-btn:hover {
      background: #f1f3f4;
    }

    .icon-btn:disabled {
      color: #c6c6c6;
      cursor: default;
      background: none;
    }

    #status {
      margin: 0;
      padding: 0 12px 6px;
      font-size: 11px;
      color: #d93025;
    }
  </style>
</head>

<body>
  <div class="bar">
    <input id="search" type="text" placeholder="Find" />
    <span id="count"></span>
    <div class="divider"></div>
    <button id="prev" class="icon-btn" type="button" title="Previous match">&#9650;</button>
    <button id="next" class="icon-btn" type="button" title="Next match">&#9660;</button>
  </div>
  <p id="status" hidden></p>
  <script type="module" src="dist/popup.js"></script>
</body>

</html>
